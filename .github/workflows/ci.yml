name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is intentionally excluded: better-sqlite3 12+ and the pi
        # runtime both assume Node 22+ APIs. Node 22 is the current LTS.
        node: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Native capability check: tree-sitter WASM ABI + sqlite-vec + FTS5.
      # A dependency bump that breaks either pair fails here, not at install time
      # for users.
      - run: npm run smoke:env

      # Load the extension through pi's jiti loader and execute a tool
      # end-to-end against a fixture project. Catches ESM/CJS interop and
      # runtime-only import problems that vitest can mask.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.pi-context-engine/models
          key: pce-embedding-model-v1
      - run: npm run smoke:loader

      # Guard the published tarball. This package ships raw .ts source (pi loads
      # TypeScript extensions at runtime via jiti — no build step). The `files`
      # allowlist is authoritative; verify nothing stray leaks in.
      - name: Verify packed tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          ! grep -E '(tests/|coverage/|scripts/|\.github/|vitest\.config)' pack.log
          grep -E 'src/extension\.ts' pack.log
          grep -E 'src/engine\.ts' pack.log
          grep -E 'LICENSE' pack.log
